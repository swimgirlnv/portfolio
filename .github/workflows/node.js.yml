name: Node.js CI & Update README

env:
  CI: ""

on:
  push:
    branches: ["becca/3684", "workflow"]
  pull_request:
    branches: ["becca/3684"]
  schedule:
    - cron: "0 * * * *"  # Runs every hour
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - run: touch repository.txt
      - run: echo ${{ github.repository }} >> repository.txt
      - run: sed -i 's/.*\///' repository.txt
      - run: |
          sed -i "s/homepage.*/homepage\": \"$(sed 's@[/\&]@\\&@g;$!s/$/\\/' repository.txt)\",/g" package.json
      - run: rm repository.txt
      - run: npm install
      - run: npm run build
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build

  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update Blog Posts
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://rwaterso.vercel.app/blog/rss.xml"

      - name: Update Random Quote
        run: |
          QUOTE=$(curl -s https://api.quotable.io/random | jq -r '.content + " - " + .author')
          sed -i "s|> \"This space for a dynamically updated quote!\"|> \"$QUOTE\"|g" README.md

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add README.md
          git commit -m "🔄 Auto-update README with latest content" || echo "No changes to commit"
          git push
