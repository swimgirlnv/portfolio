name: Node.js CI & Update README & Tarot Reading

env:
  CI: ""

on:
  push:
    branches: ["becca/3684", "workflow"]
  pull_request:
    branches: ["becca/3684"]
  schedule:
    - cron: "0 0 * * *"  # Runs once a day
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - run: touch repository.txt
      - run: echo ${{ github.repository }} >> repository.txt
      - run: sed -i 's/.*\///' repository.txt
      - run: |
          sed -i "s/homepage.*/homepage\": \"$(sed 's@[/\&]@\\&@g;$!s/$/\\/' repository.txt)\",/g" package.json
      - run: rm repository.txt
      - run: npm install
      - run: npm run build
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build

  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update Tarot Reading
        run: |
          TAROT_API="https://tarot-api.sofiane.dev/cards/random?n=3"
          TAROT_RESPONSE=$(curl -s "$TAROT_API" || echo "error")
          if [[ "$TAROT_RESPONSE" == "error" || -z "$TAROT_RESPONSE" ]]; then
            TAROT_CARDS="The Fool, The Magician, The High Priestess"
          else
            TAROT_CARDS=$(echo "$TAROT_RESPONSE" | jq -r '[.cards[].name] | join(", ")')
          fi
          INTERPRETATION=$(curl -s -X POST "https://api.openai.com/v1/completions" \
            -H "Authorization: Bearer ${{ secrets.OPENAI_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"model": "text-davinci-003", "prompt": "Interpret these tarot cards in a mystical and engaging way: '$TAROT_CARDS'", "max_tokens": 100}')
          INTERPRETATION_TEXT=$(echo "$INTERPRETATION" | jq -r '.choices[0].text' | sed 's/"/\"/g')
          sed -i "s|## 🔮 Daily Tarot Reading.*|## 🔮 Daily Tarot Reading\n**Today's Cards:**\n- 🃏 **$TAROT_CARDS**\n\n**AI Interpretation:** *$INTERPRETATION_TEXT*\n\n*(This section updates daily via GitHub Actions!)*|g" README.md

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add README.md
          git commit -m "🔮 Auto-update README with daily tarot reading" || echo "No changes to commit"
          git push
