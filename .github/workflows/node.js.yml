name: Node.js CI & Update README & Tarot Reading

env:
  CI: ""

on:
  push:
    branches: ["becca/3684", "workflow"]
  pull_request:
    branches: ["becca/3684"]
  schedule:
    - cron: "0 0 * * *"  # Runs once a day
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - run: touch repository.txt
      - run: echo ${{ github.repository }} >> repository.txt
      - run: sed -i 's/.*\///' repository.txt
      - run: |
          sed -i "s/homepage.*/homepage\": \"$(sed 's@[/\&]@\\&@g;$!s/$/\\/' repository.txt)\",/g" package.json
      - run: rm repository.txt
      - run: npm install
      - run: npm run build
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build

  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Random Tarot Reading
        run: |
          declare -a TAROT_CARDS=(
            "The Fool" "The Magician" "The High Priestess" "The Empress" "The Emperor"
            "The Hierophant" "The Lovers" "The Chariot" "Strength" "The Hermit"
            "Wheel of Fortune" "Justice" "The Hanged Man" "Death" "Temperance"
            "The Devil" "The Tower" "The Star" "The Moon" "The Sun"
            "Judgement" "The World"
            "Ace of Swords" "Two of Swords" "Three of Swords" "Four of Swords" "Five of Swords"
            "Six of Swords" "Seven of Swords" "Eight of Swords" "Nine of Swords" "Ten of Swords"
            "Page of Swords" "Knight of Swords" "Queen of Swords" "King of Swords"
            "Ace of Pentacles" "Two of Pentacles" "Three of Pentacles" "Four of Pentacles" "Five of Pentacles"
            "Six of Pentacles" "Seven of Pentacles" "Eight of Pentacles" "Nine of Pentacles" "Ten of Pentacles"
            "Page of Pentacles" "Knight of Pentacles" "Queen of Pentacles" "King of Pentacles"
            "Ace of Wands" "Two of Wands" "Three of Wands" "Four of Wands" "Five of Wands"
            "Six of Wands" "Seven of Wands" "Eight of Wands" "Nine of Wands" "Ten of Wands"
            "Page of Wands" "Knight of Wands" "Queen of Wands" "King of Wands"
            "Ace of Cups" "Two of Cups" "Three of Cups" "Four of Cups" "Five of Cups"
            "Six of Cups" "Seven of Cups" "Eight of Cups" "Nine of Cups" "Ten of Cups"
            "Page of Cups" "Knight of Cups" "Queen of Cups" "King of Cups"
          )
          
          CARD1=${TAROT_CARDS[$((RANDOM % ${#TAROT_CARDS[@]}))]}
          CARD2=${TAROT_CARDS[$((RANDOM % ${#TAROT_CARDS[@]}))]}
          CARD3=${TAROT_CARDS[$((RANDOM % ${#TAROT_CARDS[@]}))]}
          TAROT_READING="$CARD1, $CARD2, $CARD3"
          
          INTERPRETATION=$(curl -s -X POST "https://api.openai.com/v1/completions" \
            -H "Authorization: Bearer ${{ secrets.OPENAI_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"model": "text-davinci-003", "prompt": "Interpret these tarot cards in a mystical and engaging way: '$TAROT_READING'", "max_tokens": 100}')
          
          if [[ -z "$INTERPRETATION" ]]; then
            INTERPRETATION_TEXT="The future is unclear. Trust yourself."
          else
            INTERPRETATION_TEXT=$(echo "$INTERPRETATION" | jq -r '.choices[0].text' | sed 's/"/\"/g')
          fi
          
          sed -i "s|## 🔮 Daily Tarot Reading.*|## 🔮 Daily Tarot Reading\n**Today's Cards:**\n- 🃏 **$TAROT_READING**\n\n**AI Interpretation:** *$INTERPRETATION_TEXT*\n\n*(This section updates daily via GitHub Actions!)*|g" README.md

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add README.md
          git commit -m "🔮 Auto-update README with daily tarot reading" || echo "No changes to commit"
          git push